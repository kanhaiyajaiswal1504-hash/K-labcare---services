<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K - Lab Care Services</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7f6;color:#17352b}
header{background:#087c50;color:white;text-align:center;padding:18px}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0;font-size:13px}
.container{max-width:800px;margin:auto;padding:15px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:15px;box-shadow:0 2px 10px #0001}
h2{color:#087c50}
label{display:block;margin-top:10px;font-weight:bold;font-size:14px}
input,select,textarea,button{
width:100%;padding:12px;margin-top:6px;
border:1px solid #ccd8d2;border-radius:8px;
font-size:15px;box-sizing:border-box
}
button{background:#087c50;color:white;border:0;font-weight:bold;cursor:pointer}
.search{border:2px solid #087c50}
.test-list{max-height:400px;overflow:auto;margin-top:10px}
.test{
display:flex;align-items:center;
padding:10px;border-bottom:1px solid #eee
}
.test input{width:auto;margin:0 10px 0 0}
.price{margin-left:auto;font-weight:bold}
.discount{color:#087c50;font-size:12px}
.total{
font-size:22px;font-weight:bold;
color:#087c50;text-align:center;
padding:12px
}
.invoice{
background:#fff;border:2px solid #087c50;
padding:15px;border-radius:10px
}
.hidden{display:none}
.success{background:#e5f7ed;color:#087c50;padding:12px;border-radius:8px}
.error{background:#ffe8e8;color:#a00000;padding:12px;border-radius:8px}
</style>
</head>

<body>

<header>
<h1>K - Lab Care Services</h1>
<p>Online Test Booking & Home Collection</p>
</header>

<div class="container">

<div class="card">

<h2>🧪 Test Booking</h2>

<label>Patient Name</label>
<input id="name" placeholder="Patient Name">

<label>Mobile Number</label>
<input id="mobile" maxlength="10" placeholder="10 Digit Mobile Number">

<label>Email ID</label>
<input id="email" type="email" placeholder="Email ID">

<label>Age</label>
<input id="age" type="number" placeholder="Age">

<label>Gender</label>
<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Address</label>
<textarea id="address" placeholder="Full Address"></textarea>

<label>PIN Code</label>
<input id="pin" maxlength="6"
placeholder="PIN Code"
oninput="checkPin()">

<div id="pinMsg"></div>

<label>Lab / Service</label>

<select id="lab" onchange="updatePrices()">

<option value="">Select Lab</option>
<option>Thyrocare</option>
<option>Pathcare</option>
<option>General Diagnostics</option>
<option>Accuprobe</option>
<option>Sage Path Lab</option>
<option>Dr Lal Path</option>
<option>SRL</option>
<option>Medsis</option>
<option>Sewarth Path Lab (Jabalpur)</option>
<option>Redcliffe Lab</option>
<option>Dr Remedies Lab</option>
<option>Span Diagnostics</option>

</select>

<label>Collection Date</label>
<input id="date" type="date">

<label>Time Slot</label>
<select id="slot">

<option>06:00 - 06:30 AM</option>
<option>06:30 - 07:00 AM</option>
<option>07:00 - 07:30 AM</option>
<option>07:30 - 08:00 AM</option>
<option>08:00 - 08:30 AM</option>
<option>08:30 - 09:00 AM</option>
<option>09:00 - 09:30 AM</option>
<option>09:30 - 10:00 AM</option>
<option>10:00 - 10:30 AM</option>
<option>10:30 - 11:00 AM</option>
<option>11:00 - 11:30 AM</option>
<option>11:30 - 12:00 PM</option>
<option>12:00 - 12:30 PM</option>
<option>12:30 - 01:00 PM</option>
<option>01:00 - 01:30 PM</option>
<option>01:30 - 02:00 PM</option>
<option>02:00 - 02:30 PM</option>
<option>02:30 - 03:00 PM</option>
<option>03:00 - 03:30 PM</option>
<option>03:30 - 04:00 PM</option>
<option>04:00 - 04:30 PM</option>
<option>04:30 - 05:00 PM</option>
<option>05:00 - 05:30 PM</option>
<option>05:30 - 06:00 PM</option>
<option>06:00 - 06:30 PM</option>
<option>06:30 - 07:00 PM</option>
<option>07:00 - 07:30 PM</option>
<option>07:30 - 08:00 PM</option>

</select>

</div>


<div class="card">

<h2>🔎 Select Test / Package</h2>

<input
class="search"
id="search"
placeholder="Search CBC, Vitamin D, Thyroid..."
oninput="searchTests()">

<div id="tests" class="test-list"></div>

<div class="total">
Total: <span id="total">₹0</span>
</div>

</div>


<div class="card">

<h2>💳 Payment</h2>

<select id="payment">
<option>Cash</option>
<option>UPI</option>
</select>

<button onclick="bookNow()">
✅ Confirm Booking
</button>

</div>


<div id="invoice" class="card hidden">

<h2>🧾 Booking Bill</h2>

<div class="invoice" id="invoiceData"></div>

<button onclick="window.print()">
🖨 Print / Save PDF
</button>

</div>

</div>


<script>

/* =========================
LAB DISCOUNTS
========================= */

const discounts={

"Thyrocare":40,
"Pathcare":50,
"General Diagnostics":40,
"Accuprobe":50,
"Sage Path Lab":50,
"Dr Lal Path":20,
"SRL":25,
"Medsis":50,
"Sewarth Path Lab (Jabalpur)":50,
"Redcliffe Lab":30,
"Dr Remedies Lab":40,
"Span Diagnostics":40

};


/* =========================
SERVICE PIN CODES
========================= */

const servicePins=[

"482001","482002","482003","482004",
"482005","482006","482007","482008",
"482009","482010","482011",

"483501","483504","485771","485001",
"484334","486001",

"462011","462016","462003","462022",
"462042","462023","462030",

"452010","452009","452003","452002","452018",

"470001","470002","470003","470661",

"522408","456001",

"474001","474002","474003","474005",
"474006","474008","474011",

"482001","482004","482008","482011","482007"

];


/* =========================
TEST LIST
========================= */

const tests=[

["CBC",300],
["Liver Function Test",800],
["Lipid Profile",600],
["Kidney Profile",700],
["Electrolyte",450],
["Iron Profile",750],
["Vitamin D Total",1000],
["Vitamin B12",1000],
["Testosterone",800],
["Blood Sugar Fasting",100],
["Blood Sugar Random",100],
["Blood Sugar PP",100],
["Urine Analysis",150],
["Widal",250],
["Malaria",180],
["Dengue Profile",1200],
["Thyroid Profile",500],
["AMH",2500],
["LH",600],
["FSH",600],
["Prolectine",600],
["Free Testosterone",1200],
["PSA",800],
["Amylase",800],
["Lipase",800],
["SGPT",200],
["SGOT",200],
["Creatinine",200],
["Uric Acid",200],
["Total Cholesterol",250],
["Blood Group",100],
["Thyphi Dot",800],
["Urine Culture",600],
["Blood Culture",1000],
["UPCR",800],
["TB Gold",2200],
["Double Marker",2200],
["Triple Marker",3000],
["Quadruple Marker",3500],
["TORCH 8",2500],
["TORCH 10",3500],
["CA-125",1500],
["CEA",1000],
["CRP",600],
["RA Factor",600],
["Homocysteine",1500],
["Cardiac Risk Marker",1200],

["KLC-1 Health Package",2000],
["Vitamin D + Vitamin B12 Combo",1600],
["K-Labcare Fever Profile Basic",1500],
["K-Labcare Fever Profile Advance",3000]

];


/* =========================
LOAD TESTS
========================= */

function loadTests(){

let html="";

tests.forEach((t,i)=>{

html+=`

<div class="test">

<input
type="checkbox"
value="${i}"
onchange="calculate()">

<span>
${t[0]}
</span>

<span class="price" id="price${i}">
₹${t[1]}
</span>

</div>

`;

});

document.getElementById("tests").innerHTML=html;

}

loadTests();


/* =========================
SEARCH
========================= */

function searchTests(){

let q=
document.getElementById("search")
.value.toLowerCase();

document
.querySelectorAll(".test")
.forEach((row,i)=>{

let name=
tests[i][0].toLowerCase();

row.style.display=
name.includes(q)
?"flex"
:"none";

});

}


/* =========================
DISCOUNT
========================= */

function getDiscount(){

let lab=
document.getElementById("lab").value;

return discounts[lab] || 0;

}


/* =========================
UPDATE PRICES
========================= */

function updatePrices(){

let discount=getDiscount();

tests.forEach((t,i)=>{

let offer=
Math.round(
t[1]*(100-discount)/100
);

document.getElementById("price"+i).innerHTML=

`<del>₹${t[1]}</del>
<br>
<b>₹${offer}</b>
<br>
<span class="discount">
${discount}% OFF
</span>`;

});

calculate();

}


/* =========================
CALCULATE TOTAL
========================= */

function calculate(){

let discount=getDiscount();

let total=0;

document
.querySelectorAll(
'#tests input[type="checkbox"]:checked'
)
.forEach(cb=>{

let index=
parseInt(cb.value);

total+=Math.round(
tests[index][1]*
(100-discount)/100
);

});

document.getElementById("total")
.innerText=
"₹"+total.toLocaleString("en-IN");

}


/* =========================
PIN CHECK
========================= */

function checkPin(){

let pin=
document.getElementById("pin").value;

let msg=
document.getElementById("pinMsg");

if(pin.length!==6){

msg.innerHTML="";

return;

}

if(servicePins.includes(pin)){

msg.innerHTML=
'<div class="success">✓ Home Collection Available</div>';

}else{

msg.innerHTML=
'<div class="error">✕ Home Collection Available नहीं है</div>';

}

}


/* =========================
BOOKING
========================= */

function bookNow(){

let name=
document.getElementById("name").value.trim();

let mobile=
document.getElementById("mobile").value.trim();

let pin=
document.getElementById("pin").value.trim();

let lab=
document.getElementById("lab").value;

let selected=
document.querySelectorAll(
'#tests input[type="checkbox"]:checked'
);


if(!name||
!mobile||
!pin||
!lab||
selected.length===0){

alert(
"कृपया सभी जरूरी जानकारी भरें और कम से कम एक test select करें।"
);

return;

}


if(!servicePins.includes(pin)){

alert(
"इस PIN Code पर Home Collection उपलब्ध नहीं है।"
);

return;

}


let discount=
getDiscount();

let total=0;

let selectedTests=[];


selected.forEach(cb=>{

let i=
parseInt(cb.value);

let mrp=
tests[i][1];

let offer=
Math.round(
mrp*(100-discount)/100
);

total+=offer;

selectedTests.push(
tests[i][0]+
" - ₹"+offer
);

});


let bookingId=
"KLC-"+Date.now().toString().slice(-8);


document.getElementById("invoiceData")
.innerHTML=`

<h3>K - Lab Care Services</h3>

<p>
<b>Booking ID:</b>
${bookingId}
</p>

<p>
<b>Patient:</b>
${name}
</p>

<p>
<b>Mobile:</b>
${mobile}
</p>

<p>
<b>Age:</b>
${document.getElementById("age").value}
</p>

<p>
<b>Gender:</b>
${document.getElementById("gender").value}
</p>

<p>
<b>Address:</b>
${document.getElementById("address").value}
</p>

<p>
<b>PIN:</b>
${pin}
</p>

<p>
<b>Lab:</b>
${lab}
</p>

<p>
<b>Collection Date:</b>
${document.getElementById("date").value}
</p>

<p>
<b>Time:</b>
${document.getElementById("slot").value}
</p>

<p>
<b>Discount:</b>
${discount}%
</p>

<hr>

<p>
<b>Tests:</b>
</p>

<p>
${selectedTests.join("<br>")}
</p>

<hr>

<h2>
Total: ₹${total.toLocaleString("en-IN")}
</h2>

<p>
<b>Payment:</b>
${document.getElementById("payment").value}
</p>

<div class="success">
✓ Booking Successfully Created
</div>

`;


document
.getElementById("invoice")
.classList.remove("hidden");


document
.getElementById("invoice")
.scrollIntoView({
behavior:"smooth"
});

}

</script>

</body>
</html>

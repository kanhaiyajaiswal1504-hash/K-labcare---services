<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K - Lab Care Services</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f8fb;
  color:#222
}
.header{
  background:#087f8c;
  color:white;
  padding:18px 15px;
  text-align:center
}
.header h1{margin:0;font-size:24px}
.header p{margin:6px 0 0;font-size:14px}

.container{
  max-width:700px;
  margin:15px auto;
  padding:0 12px
}
.card{
  background:white;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 10px #0001
}
h2{
  margin-top:0;
  color:#087f8c;
  font-size:20px
}
label{
  display:block;
  margin-top:12px;
  font-weight:bold;
  font-size:14px
}
input,select,textarea{
  width:100%;
  padding:11px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px
}
textarea{min-height:75px}
button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:8px;
  background:#25d366;
  color:white;
  font-size:17px;
  font-weight:bold;
  margin-top:18px;
  cursor:pointer
}
.result{
  background:#eefafa;
  padding:12px;
  border-radius:8px;
  margin-top:12px
}
.amount{
  font-size:20px;
  font-weight:bold;
  color:#087f8c
}
.note{
  font-size:12px;
  color:#666;
  margin-top:8px
}
</style>
</head>

<body>

<div class="header">
  <h1>K - Lab Care Services</h1>
  <p>Online Test Booking & Home Collection</p>
</div>

<div class="container">

<div class="card">
<h2>🧪 Test Booking</h2>

<form id="bookingForm">

<label>Mobile Number *</label>

<input type="number" id="age" min="1" max="120" required>

<label>Gender *</label>
<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Address *</label>
<textarea id="address" required></textarea>

<label>PIN Code *</label>
<input type="text" id="pin" maxlength="6" required>

<label>Lab Select *</label>
<select id="lab" required>
<option value="">Select Lab</option>
<option>Thyrocare</option>
<option>Pathcare</option>
<option>General Diagnostics</option>
<option>Accuprobe</option>
<option>Sage Path Lab</option>
<option>Dr Lal Path</option>
<option>SRL</option>
<option>Medsis</option>
<option>Sewarth Path Lab (Jabalpur)</option>
<option>Redcliffe Lab</option>
<option>Dr Remedies Lab</option>
<option>Span Diagnostics</option>
</select>

<label>Collection Date *</label>
<input type="date" id="date" required>

<select id="slot" required>

<option>06:30 AM - 07:00 AM</option>
<option>07:00 AM - 07:30 AM</option>
<option>07:30 AM - 08:00 AM</option>

<option>09:00 AM - 09:30 AM</option>
<option>09:30 AM - 10:00 AM</option>
<option>10:00 AM - 10:30 AM</option>
<option>10:30 AM - 11:00 AM</option>
<option>11:00 AM - 11:30 AM</option>
<option>11:30 AM - 12:00 PM</option>
<option>12:00 PM - 12:30 PM</option>
<option>12:30 PM - 01:00 PM</option>
<option>01:00 PM - 01:30 PM</option>
<option>01:30 PM - 02:00 PM</option>
<option>02:00 PM - 02:30 PM</option>
<option>02:30 PM - 03:00 PM</option>
<option>03:00 PM - 03:30 PM</option>
<option>03:30 PM - 04:00 PM</option>
<option>04:00 PM - 04:30 PM</option>
<option>04:30 PM - 05:00 PM</option>
<option>05:00 PM - 05:30 PM</option>
<option>05:30 PM - 06:00 PM</option>
<option>06:00 PM - 06:30 PM</option>
<option>06:30 PM - 07:00 PM</option>
<option>07:00 PM - 07:30 PM</option>
<option>07:30 PM - 08:00 PM</option>
<option>08:00 PM - 08:30 PM</option>
</select>

<label>Test / Package *</label>
<select id="test" required>
<option value="">Select Test / Package</option>

<option value="CBC" data-mrp="300">CBC - ₹300</option>
<option value="Liver Function Test" data-mrp="800">Liver Function Test - ₹800</option>
<option value="Lipid Profile" data-mrp="600">Lipid Profile - ₹600</option>
<option value="Kidney Profile" data-mrp="700">Kidney Profile - ₹700</option>
<option value="Electrolyte" data-mrp="450">Electrolyte - ₹450</option>
<option value="Iron Profile" data-mrp="750">Iron Profile - ₹750</option>
<option value="Vitamin D Total" data-mrp="1000">Vitamin D Total - ₹1000</option>
<option value="Vitamin B12" data-mrp="1000">Vitamin B12 - ₹1000</option>
<option value="Testosterone" data-mrp="800">Testosterone - ₹800</option>
<option value="Blood Sugar Fasting" data-mrp="100">Blood Sugar Fasting - ₹100</option>
<option value="Blood Sugar Random" data-mrp="100">Blood Sugar Random - ₹100</option>
<option value="Blood Sugar PP" data-mrp="100">Blood Sugar PP - ₹100</option>
<option value="Urine Analysis" data-mrp="150">Urine Analysis - ₹150</option>
<option value="Widal" data-mrp="250">Widal - ₹250</option>
<option value="Malaria" data-mrp="180">Malaria - ₹180</option>
<option value="Dengue Profile" data-mrp="1200">Dengue Profile - ₹1200</option>
<option value="Thyroid Profile" data-mrp="500">Thyroid Profile - ₹500</option>
<option value="AMH" data-mrp="2500">AMH - ₹2500</option>
<option value="LH" data-mrp="600">LH - ₹600</option>
<option value="FSH" data-mrp="600">FSH - ₹600</option>
<option value="Prolectine" data-mrp="600">Prolectine - ₹600</option>
<option value="Free Testosterone" data-mrp="1200">Free Testosterone - ₹1200</option>
<option value="PSA" data-mrp="800">PSA - ₹800</option>
<option value="Amylase" data-mrp="800">Amylase - ₹800</option>
<option value="Lipase" data-mrp="800">Lipase - ₹800</option>
<option value="SGPT" data-mrp="200">SGPT - ₹200</option>
<option value="SGOT" data-mrp="200">SGOT - ₹200</option>
<option value="Creatinine" data-mrp="200">Creatinine - ₹200</option>
<option value="Uric Acid" data-mrp="200">Uric Acid - ₹200</option>
<option value="Total Cholesterol" data-mrp="250">Total Cholesterol - ₹250</option>
<option value="Blood Group" data-mrp="100">Blood Group - ₹100</option>
<option value="Thyphi Dot" data-mrp="800">Thyphi Dot - ₹800</option>
<option value="Urine Culture" data-mrp="600">Urine Culture - ₹600</option>
<option value="Blood Culture" data-mrp="1000">Blood Culture - ₹1000</option>
<option value="UPCR" data-mrp="800">UPCR - ₹800</option>
<option value="TB Gold" data-mrp="2200">TB Gold - ₹2200</option>
<option value="Double Marker" data-mrp="2200">Double Marker - ₹2200</option>
<option value="Triple Marker" data-mrp="3000">Triple Marker - ₹3000</option>
<option value="Quadruple Marker" data-mrp="3500">Quadruple Marker - ₹3500</option>
<option value="TORCH 8" data-mrp="2500">TORCH 8 - ₹2500</option>
<option value="TORCH 10" data-mrp="3500">TORCH 10 - ₹3500</option>
<option value="CA-125" data-mrp="1500">CA-125 - ₹1500</option>
<option value="CEA" data-mrp="1000">CEA - ₹1000</option>
<option value="CRP" data-mrp="600">CRP - ₹600</option>
<option value="RA Factor" data-mrp="600">RA Factor - ₹600</option>
<option value="Homocysteine" data-mrp="1500">Homocysteine - ₹1500</option>
<option value="Cardiac Risk Marker" data-mrp="1200">Cardiac Risk Marker - ₹1200</option>

<option value="KLC-1 Health Package" data-mrp="2000">
KLC-1 Health Package - ₹2000
</option>

<option value="Vitamin D + Vitamin B12 Combo" data-mrp="1600">
Vitamin D + Vitamin B12 Combo - ₹1600
</option>

<option value="K-Labcare Fever Profile Basic" data-mrp="1500">
K-Labcare Fever Profile Basic - ₹1500
</option>

<option value="K-Labcare Fever Profile Advance" data-mrp="3000">
K-Labcare Fever Profile Advance - ₹3000
</option>

</select>

<div class="result">
  <div>MRP: ₹<span id="mrp">0</span></div>
  <div>Discount: <span id="discount">0</span>%</div>
  <div class="amount">Offer Price: ₹<span id="offer">0</span></div>
</div>

<label>Payment Method *</label>
<select id="payment" required>
<option value="">Select Payment</option>
<option>Cash</option>
<option>UPI</option>
</select>

<button type="submit">
📲 WhatsApp पर Booking भेजें
</button>

<div class="note">
Booking submit करने के बाद WhatsApp खुलेगा और booking details message में आ जाएंगी।
</div>

</form>
</div>

</div>

<script>

const discounts = {
  "Thyrocare":40,
  "Pathcare":50,
  "General Diagnostics":40,
  "Accuprobe":50,
  "Sage Path Lab":50,
  "Dr Lal Path":20,
  "SRL":25,
  "Medsis":50,
  "Sewarth Path Lab (Jabalpur)":50,
  "Redcliffe Lab":30,
  "Dr Remedies Lab":40,
  "Span Diagnostics":40
};

const test = document.getElementById("test");
const lab = document.getElementById("lab");

function calculate(){

  const option = test.options[test.selectedIndex];

  if(!option || !option.dataset.mrp){
    document.getElementById("mrp").innerText = "0";
    document.getElementById("discount").innerText = "0";
    document.getElementById("offer").innerText = "0";
    return;
  }

  const mrp = Number(option.dataset.mrp);
  const discount = discounts[lab.value] || 0;
  const offer = Math.round(mrp * (100-discount) / 100);

  document.getElementById("mrp").innerText = mrp;
  document.getElementById("discount").innerText = discount;
  document.getElementById("offer").innerText = offer;
}

test.addEventListener("change",calculate);
lab.addEventListener("change",calculate);

document.getElementById("bookingForm").addEventListener("submit",function(e){

  e.preventDefault();

  const option = test.options[test.selectedIndex];

  const mrp = Number(option.dataset.mrp);
  const discount = discounts[lab.value] || 0;
  const offer = Math.round(mrp * (100-discount) / 100);

  const bookingId =
    "KLC" +
    Date.now().toString().slice(-8);

  const message =
`🧪 *K - LAB CARE SERVICES*
*Online Test Booking*

━━━━━━━━━━━━━━

🆔 *Booking ID:* ${bookingId}

👤 *Patient Name:* ${document.getElementById("name").value}

📱 *Mobile:* ${document.getElementById("mobile").value}

📧 *Email:* ${document.getElementById("email").value || "-"}

🎂 *Age:* ${document.getElementById("age").value}

⚥ *Gender:* ${document.getElementById("gender").value}

🏠 *Address:* ${document.getElementById("address").value}

📍 *PIN:* ${document.getElementById("pin").value}

🏥 *Lab:* ${lab.value}

🧪 *Test/Package:* ${option.value}

💰 *MRP:* ₹${mrp}

🎁 *Discount:* ${discount}%

💵 *Offer Price:* ₹${offer}

📅 *Collection Date:* ${document.getElementById("date").value}

⏰ *Time Slot:* ${document.getElementById("slot").value}

💳 *Payment:* ${document.getElementById("payment").value}

━━━━━━━━━━━━━━

🏠 *Home Collection Required*

Please confirm the booking.

*K - Lab Care Services*`;

  const whatsappNumber = "918120262770";

  const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.open(whatsappURL,"_blank");

});

</script>

</body>
</html>
